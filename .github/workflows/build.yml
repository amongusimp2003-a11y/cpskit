name: Build iOS Tweak

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: theosdev/devenv:latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Dylib
      run: |
        make package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CopsModMenu
        path: packages/*.deb
